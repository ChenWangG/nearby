[package]
name = "presence_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
event_poller = { path = "../../event_poller" }
ble = { path = "../../ble" }
tokio = { version = "1.36.0", features = ["sync", "rt-multi-thread", "macros"] }
log = "0.4.22"
futures = "0.3.31"
np_adv = { git = "https://beto-core.googlesource.com/beto-core.git", branch = "main" }
crypto_provider = { git = "https://beto-core.googlesource.com/beto-core.git", branch = "main" }
np_hkdf = { git = "https://beto-core.googlesource.com/beto-core.git", branch = "main" }
ldt_np_adv = { git = "https://beto-core.googlesource.com/beto-core.git", branch = "main" }
crypto_provider_default = { git = "https://beto-core.googlesource.com/beto-core.git", features = ["std", "rustcrypto"] }

jni = "0.21.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"


